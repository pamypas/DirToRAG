services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dirtoRAG-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: dirtoRAG
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dirtoRAG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
